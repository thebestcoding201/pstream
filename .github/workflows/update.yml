name: Update Web Playlist

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch playlists
        run: python update_playlist.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in webplaylist.m3u8 webplaylist.m3u; do
            if [ ! -f "$f" ]; then
              echo "❌ $f not found!"
              exit 1
            fi
          done

          git add webplaylist.m3u8 webplaylist.m3u

          if git diff --cached --quiet; then
            echo "✅ No changes detected."
          else
            git commit -m "chore: update playlists [skip ci]"
            git push
            echo "✅ Pushed changes."
          fi
